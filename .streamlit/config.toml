# Streamlit normally watches every imported library for file changes.
# With transformers that floods the log with harmless errors and wastes memory,
# so the watcher is switched off.
[server]
fileWatcherType = "none"

# A fixed light theme, so the app looks the same for every visitor
# (without this, Streamlit follows the visitor's dark or light system setting).
[theme]
base = "light"
primaryColor = "#1C1B2E"
backgroundColor = "#F5F6FA"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#1C1B2E"
